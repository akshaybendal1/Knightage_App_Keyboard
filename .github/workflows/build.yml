name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # ubuntu-latest ships the Android SDK with ANDROID_HOME set; AGP fetches any missing platform.
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: bt-keyboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Pushing a tag like v1.0 publishes a GitHub Release with the APK attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "bt-keyboard-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "bt-keyboard-${GITHUB_REF_NAME}.apk" \
            --title "BT Keyboard ${GITHUB_REF_NAME}" \
            --notes "Debug-signed APK for sideloading (Android 9+). Enable 'Install unknown apps' for your browser or file manager, then open the APK."
